name: Build and deploy Node.js app to Azure Web App - moodify-backend

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # required for actions/checkout

    steps:
      # 1️⃣ Checkout source
      - uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      # 3️⃣ Install only backend dependencies (without dev deps)
      - name: Install backend dependencies
        run: |
          cd backend
          npm install --omit=dev
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          SESSION_SECRET:  ${{ secrets.SESSION_SECRET }}

      # 4️⃣ Upload only the backend directory as artifact
      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: backend/
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      # 5️⃣ Download artifact built above
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      # 6️⃣ Login to Azure
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_933A0588CB264CCFAAE35774B008084E }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_1DE6BC943EDA419DB19C17D67D100CF1 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_3ED3FB3AF9024D768AD52438F2A5B2A6 }}

      # 7️⃣ Deploy only backend to Azure Web App
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'moodify-backend'
          slot-name: 'Production'
          package: .


